{# Live radar clock. Set brand_size: hero | nav | mid before including. #}
{% set sz = brand_size|default('hero') %}
{% if sz == 'nav' %}{% set px = 48 %}{% elif sz == 'mid' %}{% set px = 64 %}{% else %}{% set px = 80 %}{% endif %}
<div class="brand-clock brand-clock--{{ sz }}" style="width:{{ px }}px;height:{{ px }}px;overflow:hidden;flex-shrink:0;" aria-hidden="true" title="Abu Dhabi time">
    <svg class="brand-clock-svg" viewBox="0 0 100 100" width="{{ px }}" height="{{ px }}" role="img">
        <defs>
            <radialGradient id="bc-face-{{ sz }}" cx="50%" cy="42%" r="70%">
                <stop offset="0%" stop-color="#163056" />
                <stop offset="55%" stop-color="#0b1a33" />
                <stop offset="100%" stop-color="#050b16" />
            </radialGradient>
            <linearGradient id="bc-rim-{{ sz }}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f3e2a7" />
                <stop offset="45%" stop-color="#7dd3fc" />
                <stop offset="100%" stop-color="#c9a227" />
            </linearGradient>
            <radialGradient id="bc-sweep-{{ sz }}" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.0" />
                <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.0" />
                <stop offset="92%" stop-color="#7dd3fc" stop-opacity="0.22" />
                <stop offset="100%" stop-color="#f3e2a7" stop-opacity="0.55" />
            </radialGradient>
            <filter id="bc-glow-{{ sz }}" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1.1" result="b" />
                <feMerge>
                    <feMergeNode in="b" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
        <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bc-face-{{ sz }})" stroke="url(#bc-rim-{{ sz }})" stroke-width="2.2" />
        <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(125,211,252,0.18)" stroke-width="0.7" />
        <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(125,211,252,0.14)" stroke-width="0.6" />
        <circle cx="50" cy="50" r="18" fill="none" stroke="rgba(243,226,167,0.16)" stroke-width="0.6" />
        <g class="bc-sweep" filter="url(#bc-glow-{{ sz }})">
            <path d="M50 50 L50 12 A38 38 0 0 1 72 18 Z" fill="url(#bc-sweep-{{ sz }})" />
        </g>
        <g class="bc-ticks">
            {% for i in range(12) %}
            {% set major = i % 3 == 0 %}
            <line transform="rotate({{ i * 30 }} 50 50)"
                x1="50" y1="{{ 14 if major else 15.5 }}" x2="50" y2="{{ 22 if major else 19.5 }}"
                stroke="{{ '#f3e2a7' if major else 'rgba(125,211,252,0.7)' }}"
                stroke-width="{{ 2.2 if major else 1 }}" stroke-linecap="round" />
            {% endfor %}
        </g>
        <g class="bc-hands">
            <g class="bc-hour">
                <line x1="50" y1="50" x2="50" y2="30" stroke="#f3e2a7" stroke-width="3.2" stroke-linecap="round" />
            </g>
            <g class="bc-minute">
                <line x1="50" y1="50" x2="50" y2="22" stroke="#e2e8f0" stroke-width="2.1" stroke-linecap="round" />
            </g>
            <g class="bc-second">
                <line x1="50" y1="54" x2="50" y2="16" stroke="#7dd3fc" stroke-width="1.4" stroke-linecap="round" />
            </g>
            <circle cx="50" cy="50" r="3.2" fill="#f3e2a7" />
            <circle cx="50" cy="50" r="1.4" fill="#0b1220" />
        </g>
    </svg>
</div>
